name: Keep Vercel functions warm

# Vercel serverless functions cold-start after a period of idleness (not just
# after a deploy). Pinging a cheap public endpoint on a schedule keeps at
# least that function warm. See app/api/health/route.ts — no auth, no DB
# call, already used by hooks/useOnlineStatus.ts's connectivity heartbeat, so
# it's safe to hit repeatedly. This does NOT guarantee the auth-gated
# dashboard pages stay warm too (proxy.ts redirects an unauthenticated
# request before those pages' own functions ever run) — only whatever
# function Vercel happens to have bundled this route into.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 10 https://capstone826.vercel.app/api/health
